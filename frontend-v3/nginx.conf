server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 60M;

    # Every screen is a real URL now (see src/core/router.jsx), so a reload on
    # /ledger has to serve index.html rather than 404 - the router resolves the
    # path once React is running.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed assets are immutable by construction; index.html never is.
    #
    # One Cache-Control directive, not two: `expires 1y` emits its own
    # Cache-Control alongside Expires, so pairing it with `add_header
    # Cache-Control` sent the header twice - valid HTTP, but the kind of
    # response that makes a caching question take twice as long to answer.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location /api/ {
        proxy_pass http://backend:8078;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An import can take minutes; the default 60s cuts it off mid-parse.
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
