<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e1117" />
    <title>Prism</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- The theme, before the bundle loads.

         Without this the first paint uses :root - the light palette - and a
         dark-themed app opens with a white flash on every reload. It has to
         be inline and synchronous in <head> to land before the first paint,
         which is why this decision is written twice; the other copy is
         src/theme.js readTheme(), and the two must agree. -->
    <script>
      (function () {
        var theme;
        try { theme = localStorage.getItem('fa-theme'); } catch (e) { /* private mode */ }
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia
            && window.matchMedia('(prefers-color-scheme: light)').matches
            ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e1117' : '#f6f7f9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
