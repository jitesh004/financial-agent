services:
  # The ledger. A server rather than a file, because the app now serves
  # several people signing in at once - and because per-user separation is
  # enforced by PostgreSQL's row-level security rather than by every query
  # remembering a WHERE clause. See backend/app/db/engine.py.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      # The app role's password. Defaulted here so development needs no
      # secrets; the init script reads it, so the role and the connection
      # string below can never disagree.
      - FA_DB_PASSWORD=${FA_DB_PASSWORD:-financial_agent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the `financial_agent` database and the ORDINARY role the app
      # connects as. Read the comments in it before changing either.
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-financial-agent.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports:
      # Exposed for psql and for running the test suite against it. Drop this
      # line if you do not want the database reachable from the host.
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8078:8078"
    # Every app setting reaches the container from .env, whatever it is
    # called, so adding one is an .env edit and nothing more. This file used
    # to name each variable and pass it through, which meant a new setting
    # silently did not exist in Docker until somebody remembered to add a
    # line here - and which duplicated defaults that backend/app/config.py
    # already holds, free to drift from them.
    #
    # `required: false` because the dev stack is meant to come up on a fresh
    # clone with no .env at all: every setting either has a default in
    # config.py or is a feature that reports itself unconfigured.
    env_file:
      - path: .env
        required: false
    # These three come AFTER on purpose. `environment` beats `env_file`, and
    # each of them describes the container rather than the deployment, so it
    # has to win over whatever the same key says in .env - which for the
    # first two is very likely the wrong answer here:
    #
    #   FA_DATABASE_URL  .env.example points it at localhost, correct when
    #                    the backend runs on the host, unreachable from
    #                    inside this container. The database is `db` here.
    #   FA_DATA_DIR      ./data on the host is /data in the container, which
    #                    is where the volume above is mounted.
    #
    # Anything not listed here is the deployment's business, not this file's.
    environment:
      - PYTHONUNBUFFERED=1
      - FA_DATABASE_URL=postgresql://financial_agent:${FA_DB_PASSWORD:-financial_agent}@db:5432/financial_agent
      - FA_DATA_DIR=/data
    # The entrypoint refuses with an actionable message if the image is older
    # than the code - see backend/docker-entrypoint.sh for why that is worth
    # a guard rather than a bare ModuleNotFoundError.
    entrypoint: ["python", "/app/docker-entrypoint.py"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8078", "--reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY_TARGET=http://backend:8078

volumes:
  pgdata:
