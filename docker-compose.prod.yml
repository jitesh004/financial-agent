services:
  db:
    image: postgres:16-alpine
    environment:
      # Set POSTGRES_PASSWORD and FA_DB_PASSWORD in a .env beside this file.
      # The second is the password of the ordinary role the app connects as -
      # see deploy/postgres-init.sh for why the app is not the superuser.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      # Read by the init script when it creates the app role, so the role's
      # password and the connection string below come from one variable.
      - FA_DB_PASSWORD=${FA_DB_PASSWORD:?set FA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-financial-agent.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/data
    # Deliberately NOT published to the host. The frontend container reaches
    # it over the compose network; publishing 8078 would expose the API
    # directly, bypassing the TLS Caddy terminates in front of it.
    expose:
      - "8078"
    # Every app setting reaches the container from the .env beside this file,
    # whatever it is called, so adding one is an .env edit and nothing more.
    # Required here rather than optional: a production stack with no .env is
    # a misconfiguration, and failing at `up` beats starting an app that
    # cannot reach its database.
    env_file:
      - .env
    # `environment` beats `env_file`, so what follows overrides .env on
    # purpose. Three kinds of thing belong here and nothing else does:
    #
    #  1. Container shape. FA_DATABASE_URL must name the `db` service, not
    #     the localhost that .env.example carries for host-run backends, and
    #     FA_DATA_DIR must be the mount point rather than the host path.
    #  2. A production invariant. The session cookie is Secure because this
    #     stack is always behind TLS - not a deployer's choice to get wrong.
    #  3. The refusals below. `:?` fails `docker compose up` with a message
    #     naming the missing variable, which is worth keeping for the few
    #     that have no safe default: an app with no OAuth client cannot sign
    #     anybody in, and one with the wrong base URL fails at Google with
    #     "invalid_client" and no clue why. Optional settings need no line
    #     here - that is the point of env_file above.
    environment:
      - PYTHONUNBUFFERED=1
      - FA_DATABASE_URL=postgresql://financial_agent:${FA_DB_PASSWORD:?set FA_DB_PASSWORD}@db:5432/financial_agent
      - FA_DATA_DIR=/data
      - FA_SESSION_COOKIE_SECURE=true
      - FA_APP_BASE_URL=${FA_APP_BASE_URL:?set FA_APP_BASE_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
    entrypoint: ["python", "/app/docker-entrypoint.py"]
    # Spelled out because Compose's `entrypoint` override also CLEARS the
    # image's CMD - so relying on the Dockerfile's would start the entrypoint
    # with no command to hand over to. No --reload here: this is production.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8078"]
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Also unpublished: Caddy is the only thing that should answer from the
    # public internet, so the certificate covers every request.
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  # TLS terminator and the only container with published ports. Obtains and
  # renews a Let's Encrypt certificate by itself - see deploy/Caddyfile.
  caddy:
    image: caddy:2-alpine
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - FA_DOMAIN=${FA_DOMAIN:?set FA_DOMAIN, e.g. finance.example.com}
      - FA_TLS_EMAIL=${FA_TLS_EMAIL:?set FA_TLS_EMAIL for Let's Encrypt}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volumes, because losing these means re-requesting certificates
      # on every restart and running into Let's Encrypt's rate limit.
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  caddy_logs:
